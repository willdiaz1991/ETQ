# Server block para servir el SPA Angular como usuario no privilegiado.
# Escucha en 8080 (compatible con UID arbitrario de OpenShift).
#
# __BASE_PATH__ se sustituye en el build (Dockerfile) por la ruta pública donde
# se sirve la app (debe coincidir con el base-href del build):
#   "/"  → servida en la raíz del dominio
#   "/etq/" → served under that path
# Esta config funciona en ambos casos sin cambios.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 10m;

    # Redirects relativos (no filtra el puerto interno 8080 detrás del router)
    absolute_redirect off;
    port_in_redirect off;

    # ---- Compresión ----
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml application/wasm;

    # ---- Salud (HEALTHCHECK / probes) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Assets con hash → caché larga e inmutable ----
    # NOTA: add_header dentro de un location resetea los heredados; por eso se
    #       repiten las cabeceras mínimas donde se usa add_header.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|wasm)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    location /printing/ {
        proxy_pass http://backend:8080/printing/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA: toda ruta sirve el index del base path ----
    location / {
        try_files $uri $uri/ __BASE_PATH__index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # This demo only permits framing by the same origin.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self';" always;
    }
}
